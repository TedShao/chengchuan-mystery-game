name: Test and publish game
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/chengchuan-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/chengchuan-rebuild/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run verify:build
      - run: npx playwright install --with-deps chromium
      - name: Test ten-minute opening
        run: |
          node scripts/dev.mjs > /tmp/chengchuan-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5174/opening.html > /dev/null; then break; fi
            sleep 1
          done
          npm run test:thanks
      - run: npm run build:pages
      - name: Test Pages without an API server
        env:
          GAME_BASE_URL: http://127.0.0.1:5175/chengchuan-mystery-game/
        run: |
          node scripts/serve-pages.mjs > /tmp/chengchuan-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$GAME_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:pages
      - name: Package tested Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/chengchuan-rebuild/dist/pages
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested build
        id: deployment
        uses: actions/deploy-pages@v4
